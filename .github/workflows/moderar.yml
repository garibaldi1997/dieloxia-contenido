name: Ocultar o borrar publicaciones

on:
  workflow_dispatch:
    inputs:
      accion:
        description: "buscar | ocultar | borrar | editar"
        default: buscar
      objetivo:
        description: "Texto a buscar, id del calendario o id de Meta"
        required: true
      texto:
        description: "Nuevo texto (solo para editar)"
        required: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  moderar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ejecutar
        env:
          META_TOKEN_DIELOXIA: ${{ secrets.META_TOKEN_DIELOXIA }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v26.0' }}
          ACCION: ${{ inputs.accion }}
          OBJETIVO: ${{ inputs.objetivo }}
          TEXTO: ${{ inputs.texto }}
        run: python scripts/moderar.py "$ACCION" "$OBJETIVO"
      - name: Guardar registro
        if: always()
        run: |
          git config user.name "dieloxia-bot"
          git config user.email "dieloxia-bot@users.noreply.github.com"
          git add estado/
          git diff --cached --quiet || (git commit -m "Registro de moderación [skip ci]" && git pull --rebase -q && git push)
