name: Publicar en redes

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # cada 15 min, fuera de los minutos de mayor carga
  workflow_dispatch:
    inputs:
      modo:
        description: "publicar | verificar | simular"
        default: publicar

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none   # no descarga imágenes ni videos de las ramas

      - name: Traer las ramas de contenido
        run: git fetch --no-tags --filter=blob:none --depth=1 origin '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publicar
        env:
          # Un token por cuenta (ver cuentas.json). Al agregar una cuenta, añade su línea aquí.
          META_TOKEN_DIELOXIA: ${{ secrets.META_TOKEN_DIELOXIA }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v26.0' }}
          REPO: ${{ github.repository }}
          RAMAS: "1"
          DRY_RUN: ${{ inputs.modo == 'simular' && '1' || '0' }}
        run: |
          if [ "${{ inputs.modo }}" = "verificar" ]; then
            python scripts/publicar.py --verificar
          else
            python scripts/publicar.py
          fi

      - name: Guardar registro de publicaciones
        if: always()
        run: |
          if [ -n "$(git status --porcelain estado/)" ]; then
            git config user.name "dieloxia-bot"
            git config user.email "dieloxia-bot@users.noreply.github.com"
            git add estado/
            git commit -m "Registro de publicaciones [skip ci]"
            git pull --rebase -q origin main && git push origin HEAD:main
          fi
